name: seconde-workflow

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubunto-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@4.4.0

      - name: Run test
        run: npm test
