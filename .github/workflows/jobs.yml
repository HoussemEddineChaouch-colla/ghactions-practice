name: jobs

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Print job name 1
        run: "echo Job : ${{github.job}} 🟢"
        
  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Print job name 2
        run: "echo Job : ${{github.job}} 🟢"

  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Print job name 3
        run: "echo Job : ${{github.job}} 🟢"

  job_4:
    runs-on: ubuntu-latest
    needs: [job_2,job_3]
    steps:
      - name: Print job name 4
        run: "echo Job : ${{github.job}} 🟢"
      
       
